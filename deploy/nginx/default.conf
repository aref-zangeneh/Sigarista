server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Marks public access so the API can close /health to the outside
        # (admin panel) without breaking the container's own healthcheck.
        proxy_set_header X-Sugarista-Public 1;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        set $admin_upstream admin-ui:80;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://$admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # /db-admin (Adminer) — closed by default. The admin panel opens it at
    # runtime by writing a marker file into the shared app-config volume
    # (/config here, /app/config inside the api container). While the marker
    # exists the request is bridged to Adminer; otherwise visitors are
    # redirected to the homepage.
    location /db-admin/ {
        error_page 418 = @db_admin_open;
        if (-f /config/route-flag-db-admin-open) {
            return 418;
        }
        return 302 /;
    }

    location @db_admin_open {
        set $adminer_upstream db-admin:8080;
        rewrite ^/db-admin/(.*)$ /$1 break;
        proxy_pass http://$adminer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exact path without trailing slash — keep the nice URL form working.
    location = /db-admin {
        return 301 /db-admin/;
    }

    location / {
        set $public_upstream public-ui:80;
        proxy_pass http://$public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
